<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPath AI - Твой навигатор обучения</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4A90E2; --bg: #f4f7f9; --text: #333; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 24px; }
        .question { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 10px; }
        .options { display: grid; gap: 10px; margin-top: 10px; }
        label { cursor: pointer; display: block; padding: 5px; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 600; margin-top: 10px; }
        button:hover { background: #357ABD; }
        .ai-output { background: #f0f7ff; border-left: 5px solid var(--primary); padding: 15px; margin-top: 20px; white-space: pre-wrap; font-size: 15px; }
        #loading { display: none; text-align: center; color: var(--primary); font-weight: bold; margin: 20px 0; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 SmartPath AI</h1>
    
    <form id="quizForm">
        <div class="question">
            <p><strong>1. Как ты лучше разберешься в новой программе?</strong></p>
            <div class="options">
                <label><input type="radio" name="q1" value="Визуал (картинки, иконки)" required> Рассмотрю скриншоты и иконки</label>
                <label><input type="radio" name="q1" value="Аудиал (слух)"> Послушаю видеообзор со звуком</label>
                <label><input type="radio" name="q1" value="Кинестетик (практика)"> Буду сразу тыкать во все кнопки</label>
                <label><input type="radio" name="q1" value="Дигитал (текст)"> Прочитаю текстовую справку</label>
            </div>
        </div>

        <div class="question">
            <p><strong>2. Ты потерялся в незнакомом районе. Твои действия?</strong></p>
            <div class="options">
                <label><input type="radio" name="q2" value="Карта/Визуал" required> Посмотрю на карту в телефоне</label>
                <label><input type="radio" name="q2" value="Общение/Аудиал"> Спрошу дорогу у прохожего</label>
                <label><input type="radio" name="q2" value="Интуиция/Движение"> Пойду наугад по вывескам</label>
                <label><input type="radio" name="q2" value="Инструкции"> Прочитаю текстовый список поворотов</label>
            </div>
        </div>

        <button type="button" id="submitBtn" onclick="runAI()">Получить персональный план</button>
    </form>

    <div id="loading">🤖 ИИ анализирует ответы, подожди...</div>
    <div id="errorBox" class="error"></div>

    <div id="resultArea" style="display:none;">
        <h2>✨ Твой персональный план:</h2>
        <div id="aiResponse" class="ai-output"></div>
        <button onclick="window.location.reload()" style="background: #666;">Пройти заново</button>
    </div>
</div>

<script>
    // СЮДА ВСТАВЬ СВОЙ КЛЮЧ
    const API_KEY = 'AIzaSyBpBsMq6DHbKVG0qanqq7hl3zwHbSovLBc'; 

    async function runAI() {
        const form = document.getElementById('quizForm');
        const formData = new FormData(form);
        const results = Object.fromEntries(formData.entries());

        // Проверка заполнения
        if (Object.keys(results).length < 2) {
            alert("Пожалуйста, ответь на все вопросы!");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const resultArea = document.getElementById('resultArea');
        const aiResponse = document.getElementById('aiResponse');

        // Показываем загрузку
        form.style.display = 'none';
        loading.style.display = 'block';
        errorBox.style.display = 'none';

        const prompt = `Пользователь прошел тест на стиль обучения. 
        Ответы: 1 вопрос - ${results.q1}, 2 вопрос - ${results.q2}.
        На основе этих ответов:
        1. Определи его тип обучения (VARK).
        2. Составь краткий план: как ему эффективнее учиться.
        3. Дай 3 конкретных совета.
        Пиши по-русски, дружелюбно и структурировано.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            const text = data.candidates[0].content.parts[0].text;
            
            // Красиво оформляем текст (заменяем жирный шрифт и переносы)
            aiResponse.innerHTML = text
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');

            loading.style.display = 'none';
            resultArea.style.display = 'block';

        } catch (e) {
            loading.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = "<b>Ошибка:</b> " + e.message + "<br><br>Проверь API ключ или включи VPN (если Google блокирует запрос из твоего региона).";
            form.style.display = 'block';
        }
    }
</script>

</body>
</html>
